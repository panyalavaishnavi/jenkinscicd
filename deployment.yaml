apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-cicd-app
  namespace: cicd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins-cicd-app
  template:
    metadata:
      labels:
        app: jenkins-cicd-app
    spec:
      containers:
        - name: jenkins-cicd-app
          image: localhost:5000/jenkins-cicd-app:v1
          ports:
            - containerPort: 8080